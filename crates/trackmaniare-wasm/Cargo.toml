[package]
name = "trackmaniare-wasm"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
trackmaniare = { package = "TrackmaniaRE", path = "../trackmaniare" }
# Must match the `wasm-bindgen` CLI that post-processes the module; wasm-pack
# reads this pin from the lockfile and installs the matching CLI itself.
wasm-bindgen = "=0.2.91"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[workspace]
members = ["crates/trackmaniare", "crates/trackmaniare-wasm"]
# Plain `cargo build` / `cargo run` / `cargo run --example` keep targeting the
# extractor, so all documented commands and the binary path stay as they were.
# Use `--workspace` (or `-p trackmaniare-wasm`) to reach the WASM bindings.
default-members = ["crates/trackmaniare"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
